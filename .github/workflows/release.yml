name: release

# release-please opens and maintains the release PR; merging it cuts a release
# and the publish job in the same run builds the image for it.
#
# release-please runs under a personal access token so that the release PR is
# authored by a user rather than by GITHUB_TOKEN, whose pull requests do not
# trigger workflows: the build never runs on them and they sit at
# action_required until someone approves each one by hand.
#
# publish stays in this workflow rather than moving to the release event, and
# stays on GITHUB_TOKEN. Pushing from a workflow is also what links the package
# to this repository; a push from anywhere else leaves it unlinked, and the
# name then refuses GITHUB_TOKEN until the package is deleted.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
